[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-dependent-vit-patch-loss"
version = "0.1.0"
description = "Task-dependent rank and alignment limitations of patch tokenization"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0", "PyYAML>=6.0", "tqdm>=4.65", "threadpoolctl>=3.1", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
natural = ["torchvision>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
exclude = ["runs", "reports", "paper"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
